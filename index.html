<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>豐豐大俠製作歌詞工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Microsoft JhengHei', sans-serif;
      background: url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #5c3c27;
      padding: 20px;
      line-height: 1.5;
    }

    .app-container {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      padding: 20px;
      padding-bottom: 150px;
      border-radius: 12px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    input, textarea {
      width: 100%;
      max-width: 500px;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .lyrics-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    textarea {
      flex: 2;
      min-width: 280px;
      height: 200px;
      resize: vertical;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      margin: 8px 5px;
      background: linear-gradient(180deg, #ffb899, #e07a5f);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b85a46;
      transition: 0.15s;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b85a46;
    }

    audio {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: 90%;
      max-width: 600px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .active-line {
      background-color: #fff3b0;
      font-weight: bold;
      transition: background 0.3s;
    }
  </style>
</head>
<body>

<div class="app-container">

  <h2>豐豐大俠製作歌詞工具</h2>

<div class="box">
  <h2>一鍵把歡歌合唱歌詞檔案轉換正常歡歌格式歌詞檔案</h2>
<button onclick="importExportOneKey()">📂 選擇歡歌合唱歌詞檔案</button>
</div>

<script>

async function importExportOneKey() {
  try {
    // 1️⃣ 選擇任何副檔名的檔案（最保險寫法：不限制 types）
    const [handle] = await window.showOpenFilePicker({
      multiple: false
    });

    // 2️⃣ 讀取檔案內容
    const file = await handle.getFile();
    let text = await file.text();

    // 3️⃣ 嘗試解析 JSON
    let json;
    try {
      json = JSON.parse(text);
    } catch {
      alert("❌ 檔案不是 JSON 格式，無法讀取 lyric！");
      return;
    }

    if (!json.lyric) {
      alert("❌ 檔案缺少 lyric 欄位！");
      return;
    }

    // 4️⃣ Base64 → Big5 → 正常中文（關鍵）
    let decoded = atob(json.lyric);
    decoded = decodeURIComponent(escape(decoded));

    // 5️⃣ 覆寫同一個檔案（輸出正常中文歌詞）
    const writable = await handle.createWritable();
    await writable.write(decoded);
    await writable.close();

    alert("✅ 已成功匯出正常中文歌詞！（已覆寫原檔）");

  } catch (err) {
    console.log(err);
  }
}

</script>

</body>
</html>
   

  <section>
    <label>合唱格式檔案：</label>
    <input type="file" id="huangeFile" accept=" " onchange="loadHuanGeFile()" />
   </section>
  <section>
    <label>音樂格式檔案：</label>
    <input type="file" id="audioFile" accept="audio/*" />
    <audio id="audio" controls preload="auto"></audio>
  </section>

  <section>
    <button onclick="insertTemplate()">✨ 插入標準模版</button>
  </section>

  <section class="lyrics-container">
    <textarea id="lyricInput" placeholder="每行一句歌詞，可插入 emoji 🎶💕🔥"></textarea>
  </section>

  <section>
    <button onclick="splitLyrics()">📄 拆句並設置對拍按鈕</button>
    <button onclick="reloadLyrics()">🔄 重新載入歌詞（保留時間）</button>
  </section>

  <section>
     <div id="linesOutput"></div>
  </section>

  <section>
       <button onclick="exportTXT()">🎤 匯出歡歌格式</button>
  </section>

</div>

<script>
  const audio = document.getElementById("audio");
  const textarea = document.getElementById("lyricInput");
  const linesOutput = document.getElementById("linesOutput");

  let lyricData = [];

  /* ⭐ 載入音樂 */
  document.getElementById("audioFile").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    audio.src = url;
    audio.load();
  });

  function formatTime(t) {
    const min = String(Math.floor(t / 60)).padStart(2, "0");
    const sec = Math.floor(t % 60);
    const hundredths = Math.floor((t % 1) * 100);
    return `${min}:${String(sec).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
  }

  /* ⭐ 載入歡歌 JSON（含 Base64 → Big5 → 中文） */
  function loadHuanGeFile() {
    const file = document.getElementById("huangeFile").files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
      let text = e.target.result;

      if (text.charCodeAt(0) === 0xFEFF) {
        text = text.slice(1);
      }

      let json;
      try {
        json = JSON.parse(text);
      } catch (err) {
        alert("檔案不是 JSON 格式，無法載入");
        return;
      }

      if (!json.lyric) {
        alert("檔案缺少 lyric 欄位");
        return;
      }

      let decoded = atob(json.lyric);
      decoded = decodeURIComponent(escape(decoded));

      const lines = decoded.split(/[\n\r]+/);

      lyricData = lines.map((line, idx) => ({
        id: Date.now() + idx,
        text: line,
        time: null
      }));

      textarea.value = lines.join("\n");
      renderLines();

      alert("歡歌合唱格式歌詞已載入（亂碼已修正）！");
    };

    reader.readAsBinaryString(file);
  }

  /* ⭐ 匯出歡歌格式（原本功能） */
  function exportTXT() {
    let output = "\n";

    lyricData.forEach((item, i) => {
      if (item.time !== null) {
        const start = Math.round(item.time * 1000);
        const end = lyricData[i + 1]
          ? Math.round((lyricData[i + 1].time - item.time) * 1000)
          : 3000;

        output += `[${start},${end}]<0,${end},0>${item.text}\n`;
      }
    });

    const blob = new Blob(["\uFEFF" + output], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "95757";
    a.click();
  }

  /* ⭐ 拆句 */
  function splitLyrics() {
    const lines = textarea.value.trim().split(/[\n\r]+/);

    if (lyricData.length === 0) {
      lyricData = lines.map((line, idx) => ({
        id: Date.now() + idx,
        text: line,
        time: null
      }));
    } else {
      lines.forEach((line, idx) => {
        if (lyricData[idx]) {
          lyricData[idx].text = line;
        } else {
          lyricData.push({
            id: Date.now() + idx,
            text: line,
            time: null
          });
        }
      });

      lyricData = lyricData.slice(0, lines.length);
    }

    renderLines();
  }

  /* ⭐ 重新載入歌詞（保留時間） */
  function reloadLyrics() {
    const newLines = textarea.value.trim().split(/[\n\r]+/);
    const newData = [];

    for (let i = 0; i < newLines.length; i++) {
      if (lyricData[i]) {
        newData.push({
          id: lyricData[i].id,
          text: newLines[i],
          time: lyricData[i].time
        });
      } else {
        newData.push({
          id: Date.now() + i,
          text: newLines[i],
          time: null
        });
      }
    }

    lyricData = newData;
    renderLines();
  }

  /* ⭐ 渲染對拍區 */
  function renderLines() {
    linesOutput.innerHTML = "";

    lyricData.forEach((item, idx) => {
      const container = document.createElement("div");
      container.className = "line-item";
      container.style.marginBottom = "8px";

      const btn = document.createElement("button");
      btn.textContent = item.time ? `✅ ${formatTime(item.time)}` : "🎯 記錄";
      btn.onclick = () => {
        const t = audio.currentTime;
        item.time = t;
        timeInput.value = formatTime(t);
        btn.textContent = `✅ ${formatTime(t)}`;
      };

      const minus = document.createElement("button");
      minus.textContent = "−";
      minus.onclick = () => {
        if (item.time !== null) {
          item.time = Math.max(0, item.time - 0.1);
          timeInput.value = formatTime(item.time);
        }
      };

      const plus = document.createElement("button");
      plus.textContent = "+";
      plus.onclick = () => {
        if (item.time !== null) {
          item.time += 0.1;
          timeInput.value = formatTime(item.time);
        }
      };

      const timeInput = document.createElement("input");
      timeInput.type = "text";
      timeInput.placeholder = "00:00.00";
      timeInput.size = 7;
      timeInput.value = item.time ? formatTime(item.time) : "";
      timeInput.addEventListener("change", () => {
        const parts = timeInput.value.split(/[:.]/).map(Number);
        const min = parts[0] || 0;
        const sec = parts[1] || 0;
        const hs  = parts[2] || 0;
        item.time = min * 60 + sec + hs / 100;
      });

      const span = document.createElement("span");
      span.textContent = " " + item.text;

      container.append(btn, minus, plus, timeInput, span);
      linesOutput.appendChild(container);
    });
  }

  /* ⭐ 自動高亮 */
  audio.addEventListener("timeupdate", () => {
    const current = audio.currentTime;
    let activeIdx = -1;

    lyricData.forEach((item, idx) => {
      if (item.time !== null && current >= item.time) {
        activeIdx = idx;
      }
    });

    document.querySelectorAll(".line-item").forEach((line, idx) => {
      line.classList.toggle("active-line", idx === activeIdx);
      if (idx === activeIdx) {
        line.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  });

  /* ⭐ 插入模版 */
  function insertTemplate() {
    const pwd = prompt("請輸入密碼以插入標準模版：");

    if (pwd !== "790614") {
      alert("密碼錯誤，無法插入模版！");
      return;
    }

    const template = 
`༄༅༘ꕥ 豐豐大俠 ꕥ༘༅༄
原唱：
3️⃣
2️⃣
1️⃣

༄༅༘ꕥ完ꕥ༘༅༄`;

    textarea.value = template + "\n\n" + textarea.value;
    alert("模版已成功插入！");
  }
</script>

</body>
</html>
