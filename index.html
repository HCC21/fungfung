<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>豐豐大俠製作歌詞工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Microsoft JhengHei', sans-serif;
      background: url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #5c3c27;
      padding: 20px;
      line-height: 1.5;
    }

    .app-container {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      padding: 20px;
      padding-bottom: 150px; /* 防止按鈕被播放器遮住 */
      border-radius: 12px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    input, textarea {
      width: 100%;
      max-width: 500px;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .lyrics-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    textarea {
      flex: 2;
      min-width: 280px;
      height: 200px;
      resize: vertical;
    }

    /* ⭐ 立體浮雕按鈕 */
    button {
      padding: 10px 18px;
      font-size: 16px;
      margin: 8px 5px;
      background: linear-gradient(180deg, #ffb899, #e07a5f);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b85a46;
      transition: 0.15s;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b85a46;
    }

    audio {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: 90%;
      max-width: 600px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .active-line {
      background-color: #fff3b0;
      font-weight: bold;
      transition: background 0.3s;
    }
  </style>
</head>
<body>

<div class="app-container">

  <h2>༄༅༘ꕥ 豐豐大俠 ꕥ༘༅༄製作歌詞工具</h2>

  <section>
    <input type="file" id="audioFile" accept="audio/*" />
    <audio id="audio" controls preload="auto"></audio>
  </section>

  <section class="lyrics-container">
    <textarea id="lyricInput" placeholder="每行一句歌詞，可插入 emoji 🎶💕🔥"></textarea>
  </section>

  <!-- ⭐ 所有按鈕平排 -->
  <section>
    <button onclick="insertTemplate()">✨ 插入標準模版</button>
    <button onclick="exportTXT()">🎤 匯出歡歌格式</button>
    <button onclick="splitLyrics()">📄 拆句並設置對拍按鈕</button>
    <button onclick="reloadLyrics()">🔄 重新載入歌詞（保留時間）</button>
  </section>

  <section>
     <div id="linesOutput"></div>
  </section>

</div>

<script>
  const audio = document.getElementById("audio");
  const textarea = document.getElementById("lyricInput");
  const linesOutput = document.getElementById("linesOutput");

  /* ⭐ 行 ID + 時間資料 */
  let lyricData = [];

  document.getElementById("audioFile").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    audio.src = url;
    audio.load();
  });

  function formatTime(t) {
    const min = String(Math.floor(t / 60)).padStart(2, "0");
    const sec = Math.floor(t % 60);
    const hundredths = Math.floor((t % 1) * 100);
    return `${min}:${String(sec).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
  }

  /* ⭐ 匯出歡歌格式 */
  function exportTXT() {
    let output = "\n";

    lyricData.forEach((item, i) => {
      if (item.time !== null) {
        const start = Math.round(item.time * 1000);
        const end = lyricData[i + 1]
          ? Math.round((lyricData[i + 1].time - item.time) * 1000)
          : 3000;

        output += `[${start},${end}]<0,${end},0>${item.text}\n`;
      }
    });

    const blob = new Blob(["\uFEFF" + output], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "95757";
    a.click();
  }

  /* ⭐ 拆句（第一次建立 ID） */
  function splitLyrics() {
    const lines = textarea.value.trim().split(/[\n\r]+/);

    if (lyricData.length === 0) {
      lyricData = lines.map((line, idx) => ({
        id: Date.now() + idx,
        text: line,
        time: null
      }));
    } else {
      lines.forEach((line, idx) => {
        if (lyricData[idx]) {
          lyricData[idx].text = line;
        } else {
          lyricData.push({
            id: Date.now() + idx,
            text: line,
            time: null
          });
        }
      });

      lyricData = lyricData.slice(0, lines.length);
    }

    renderLines();
  }

  /* ⭐ 重新載入歌詞（保留時間） */
  function reloadLyrics() {
    const newLines = textarea.value.trim().split(/[\n\r]+/);
    const newData = [];

    for (let i = 0; i < newLines.length; i++) {
      if (lyricData[i]) {
        newData.push({
          id: lyricData[i].id,
          text: newLines[i],
          time: lyricData[i].time
        });
      } else {
        newData.push({
          id: Date.now() + i,
          text: newLines[i],
          time: null
        });
      }
    }

    lyricData = newData;
    renderLines();
  }

  /* ⭐ 渲染對拍區 */
  function renderLines() {
    linesOutput.innerHTML = "";

    lyricData.forEach((item, idx) => {
      const container = document.createElement("div");
      container.className = "line-item";
      container.style.marginBottom = "8px";

      const btn = document.createElement("button");
      btn.textContent = item.time ? `✅ ${formatTime(item.time)}` : "🎯 記錄";
      btn.onclick = () => {
        const t = audio.currentTime;
        item.time = t;
        timeInput.value = formatTime(t);
        btn.textContent = `✅ ${formatTime(t)}`;
      };

      const minus = document.createElement("button");
      minus.textContent = "−";
      minus.onclick = () => {
        if (item.time !== null) {
          item.time = Math.max(0, item.time - 0.1);
          timeInput.value = formatTime(item.time);
        }
      };

      const plus = document.createElement("button");
      plus.textContent = "+";
      plus.onclick = () => {
        if (item.time !== null) {
          item.time += 0.1;
          timeInput.value = formatTime(item.time);
        }
      };

      const timeInput = document.createElement("input");
      timeInput.type = "text";
      timeInput.placeholder = "00:00.00";
      timeInput.size = 7;
      timeInput.value = item.time ? formatTime(item.time) : "";
      timeInput.addEventListener("change", () => {
        const [min, sec, hs] = timeInput.value.split(/[:.]/).map(Number);
        item.time = min * 60 + sec + (hs || 0) / 100;
      });

      const span = document.createElement("span");
      span.textContent = " " + item.text;

      container.append(btn, minus, plus, timeInput, span);
      linesOutput.appendChild(container);
    });
  }

  /* ⭐ 自動高亮 */
  audio.addEventListener("timeupdate", () => {
    const current = audio.currentTime;
    let activeIdx = -1;

    lyricData.forEach((item, idx) => {
      if (item.time !== null && current >= item.time) {
        activeIdx = idx;
      }
    });

    document.querySelectorAll(".line-item").forEach((line, idx) => {
      line.classList.toggle("active-line", idx === activeIdx);
      if (idx === activeIdx) {
        line.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  });

  /* ⭐ 插入模版 */
  function insertTemplate() {
    const pwd = prompt("請輸入密碼以插入標準模版：");

    if (pwd !== "790614") {
      alert("密碼錯誤，無法插入模版！");
      return;
    }

    const template = 
`༄༅༘ꕥ 豐豐大俠 ꕥ༘༅༄
原唱：
3️⃣
2️⃣
1️⃣

༄༅༘ꕥ完ꕥ༘༅༄`;

    textarea.value = template + "\n\n" + textarea.value;
    alert("模版已成功插入！");
  }
</script>

</body>
</html>
